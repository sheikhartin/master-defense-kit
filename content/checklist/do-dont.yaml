doDonts:
  - bad: "BCOA بهترین الگوریتم دنیاست."
    good: "در مجموعه آزمایش‌شده، عملکرد رقابتی و در بسیاری موارد برتر نشان داد."
  - bad: "دیگر موقعیت را محاسبه نمی‌کنیم."
    good: "حرکت زاویه‌محور را به‌صورت صریح در دینامیک جستجو مدل می‌کنیم."
  - bad: "تمام محاسبات فاصله‌ای حذف شده‌اند."
    good: "ساختار پیشنهادی وابستگی به برخی محاسبات هندسی مبتنی بر فاصله را کاهش می‌دهد."
  - bad: "اگر آلفا بد تنظیم شود، وراثت مشکل را حل می‌کند."
    good: "تنظیم پارامتر همچنان یک محدودیت است."
  - bad: "پهپاد برای زلزله را در پایان‌نامه شبیه‌سازی کردم."
    good: "این یک سناریوی کاربردی بالقوه برای چنین مسئله‌ای است."
  - bad: "صدها هزار یا میلیون‌ها دلار صرفه‌جویی کردیم."
    good: "در کاربرد صنعتی، چنین بهینه‌سازی‌هایی می‌توانند اثر اقتصادی قابل‌توجهی داشته باشند؛ اما در این پژوهش مقدار دلاری مشخصی اندازه‌گیری نشده است."
