governingPrinciple: "هدف، ساختن یک «ارائه علمی قابل دفاع» است؛ نه تبلیغ الگوریتم."
missionPoints:
  - "یک مسئله روشن وجود داشت: کنترل جستجو و ایجاد تعادل بین جستجوی گسترده و جستجوی متمرکز."
  - "پژوهش یک ایده مشخص برای مدل‌سازی صریح حرکت زاویه‌محور پیشنهاد کرد."
  - "این ایده به یک مدل ریاضی و الگوریتم مشخص تبدیل شد."
  - "روش روی مجموعه‌ای نسبتاً گسترده از توابع محک و مسائل مهندسی ارزیابی شد."
  - "نتایج تجربی، آماری، پایداری و تحلیل حذف مؤلفه‌ها شواهدی از عملکرد رقابتی روش ارائه کردند."
memoryTakeaways:
  - "مسئله روشن بود."
  - "ایده مشخص بود."
  - "مدل ریاضی واقعی بود."
  - "شواهد ارزیابی متنوع و قابل دفاع بودند."
fiveNumbers:
  - n: "۳۲"
    label: "تابع محک"
  - n: "۱۶ + ۱۶"
    label: "تک‌قله‌ای و چندقله‌ای"
  - n: "۳۰"
    label: "اجرای مستقل"
  - n: "۱٫۰۹"
    label: "میانگین رتبه فریدمن"
  - n: "۴٫۶۲"
    label: "رتبه نسخه بدون حرکت زاویه‌محور"
claimBoundaries:
  - q: "بهترین جهانی؟"
    a: "خیر؛ عملکرد رقابتی در مجموعه آزمایش‌شده"
  - q: "پیوسته یا گسسته؟"
    a: "هسته روش پیوسته است"
  - q: "پارامترها کاملاً خودکار؟"
    a: "خیر؛ همچنان به تنظیم نیاز دارد"
  - q: "همه نتایج صددرصد موفق؟"
    a: "خیر؛ نرخ موفقیت سنجه تکرارپذیری است"
  - q: "اثبات نظری بهینگی جهانی؟"
    a: "خیر؛ شواهد تجربی و آماری"
practiceMethods:
  - t: "بدون متن"
    d: "فقط عناوین بیست اسلاید را ببین و داستان را تعریف کن."
  - t: "با زمان‌سنج"
    d: "هدف: پایان بین ۱۹:۳۰ تا ۱۹:۴۵."
  - t: "تمرین ریاضی"
    d: "فقط اسلایدهای ۹ و ۱۰ را پنج بار توضیح بده، بدون خواندن فرمول."
  - t: "تمرین پرسش"
    d: "یک نفر ده سؤال بپرسد و هر پاسخ حداکثر ۴۵ تا ۶۰ ثانیه باشد."
  - t: "داور سخت‌گیر"
    d: "سؤالات پیاپی: چرا؟ چرا این روش؟ مدرک چیست؟ محدودیت چیست؟"
answerPattern:
  title: "ساختار پاسخ: ادعا، دلیل، شاهد"
  example: "مثال: بله، این مؤلفه مهم است؛ چون مستقیماً مسیر جستجو را اصلاح می‌کند؛ و شاهد تجربی آن افت رتبه از ۱ به ۴٫۶۲ در مطالعه حذف مؤلفه‌هاست."
outOfScopeSteps:
  - "گام ۱: زمان بخر، ولی طبیعی. مثلاً: «سؤال مهمی است؛ اجازه بدهید آن را از دو زاویه پاسخ بدهم.»"
  - "گام ۲: محدوده را مشخص کن: «در آزمایش فعلی ما این حالت به‌صورت مستقیم بررسی نشده است...»"
  - "گام ۳: آنچه می‌دانی را بگو: «اما از نظر ساختار الگوریتم، انتظار منطقی این است که...»"
  - "گام ۴: ادعای قطعی نساز: «برای نتیجه‌گیری قطعی، به آزمایش مستقل نیاز داریم.»"
qaPresence:
  pattern: "الگوی نگاه: داور، سپس اسلاید، سپس داور."
  speed: "مقدمه متوسط، مسئله کمی آهسته‌تر، ریاضیات شمرده، نتایج کمی سریع‌تر ولی واضح، جمع‌بندی آهسته‌تر."
  person: "آرام. دقیق. مسلط. قابل نقد."
successLine: "در پایان باید نشان بدهی که هم عملکردت را می‌شناسی و هم محدودیتت را؛ این همان نقطه‌ای است که ارائه از «معرفی یک الگوریتم» به «دفاع از یک پژوهش» تبدیل می‌شود."
