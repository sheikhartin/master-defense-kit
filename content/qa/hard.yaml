items:
  - id: 101
    category: "سخت"
    question: "اگر یک الگوریتم دیگر روی یک تابع بهتر باشد چه؟"
    answer: "طبیعی است. الگوریتم‌های فراابتکاری معمولاً به ماهیت مسئله حساس‌اند. هدف پژوهش اثبات برتری مطلق در همه مسائل نیست؛ هدف نشان دادن عملکرد رقابتی و پایدار در یک مجموعه متنوع و مشخص از مسائل است."
  - id: 102
    category: "سخت"
    question: "آیا از روی این نتایج می‌توان ادعای بهینه جهانی کرد؟"
    answer: "خیر، نه به‌صورت نظری. در این پژوهش درباره نزدیک شدن به جواب‌های بسیار باکیفیت، رتبه‌بندی تجربی، پایداری و نرخ موفقیت صحبت می‌کنیم؛ ادعای اثبات بهینگی سراسری برای هر اجرای تصادفی مطرح نمی‌کنیم."
  - id: 103
    category: "سخت"
    question: "آیا کاهش زمان اجرا الزاماً ناشی از زاویه است؟"
    answer: "نه، این را نمی‌توان به‌صورت علّی فقط به زاویه نسبت داد مگر آزمایش جداگانه‌ای برای آن طراحی شده باشد. در مقاله، کارایی زمان اجرا برای خود BCOA گزارش شده و طراحی زاویه‌محور یکی از عوامل ساختاری آن است."
  - id: 104
    category: "سخت"
    question: "چرا همه پارامترها در یک رابطه واحد نیستند؟"
    answer: "چون در BCOA پارامترها نقش‌های متفاوتی دارند: بعضی روی حرکت موقعیت، بعضی روی اصلاح زاویه، بعضی روی شدت اختلال و بعضی روی انحراف مسیر اثر می‌گذارند. برای همین در روابط مختلف ظاهر می‌شوند."
