items:
  - id: 1
    category: "آسان"
    question: "چرا اصلاً به یک الگوریتم جدید نیاز بود؟"
    answer: "هدف فقط ساختن یک الگوریتم با استعاره زیستی جدید نبود. شکاف مورد نظر، مدل‌سازی صریح حرکت زاویه‌محور در فرایند جستجو بود. BCOA این جهت را وارد مدل می‌کند و آن را با وراثت، اصلاح تطبیقی و رقابت سرزمینی ترکیب می‌کند."
    tip: "سهم اصلی در ساختار جستجو و مدل ریاضی است، نه نام پرنده."
    keySentence: "شکاف پژوهش، صریح‌سازی حرکت زاویه‌محور بود، نه ساختن یک استعاره تازه."
  - id: 2
    category: "آسان"
    question: "پس BCOA فقط یک الگوریتم طبیعت‌الهام دیگر نیست؟"
    answer: "الهام زیستی نقطه شروع است، ولی سهم پژوهش در تبدیل رفتار به سازوکار محاسباتی است؛ به‌خصوص صریح کردن حرکت زاویه‌محور، انتقال جهت موفق، اصلاح زاویه و رقابت سرزمینی."
    keySentence: "استعاره فقط نقطه شروع است؛ سهم اصلی، مدل محاسباتی است."
  - id: 3
    category: "سخت"
    question: "چرا زاویه بهتر از موقعیت یا فاصله است؟"
    answer: "من ادعا نمی‌کنم زاویه در همه مسائل ذاتاً بهتر است. ادعای دقیق این است که صریح کردن حرکت زاویه‌محور، امکان کنترل مستقیم‌تر مسیر جستجو را فراهم می‌کند و در BCOA همراه با سایر سازوکارها عملکرد رقابتی ایجاد کرده است. مطالعه حذف مؤلفه‌ها نیز نشان می‌دهد حذف حرکت زاویه‌محور با بیشترین افت عملکرد همراه شده است."
    tip: "این پاسخ عمداً مطلق نیست؛ از قاطعیت بی‌دلیل پرهیز کن."
  - id: 4
    category: "روش"
    question: "PSO چه تفاوتی با این ایده دارد؟"
    answer: "PSO هم اطلاعات جمعی را در حرکت استفاده می‌کند، اما در BCOA جهت مهاجرت به‌صورت یک متغیر صریح در مدل تعریف شده و این جهت با وراثت زاویه، همسایه موفق، اختلال تطبیقی و رقابت سرزمینی ترکیب می‌شود. تفاوت در دینامیک کامل جستجوست، نه فقط وجود یا عدم وجود جهت."
    keySentence: "تفاوت در کل دینامیک جستجوست، نه در یک جزء."
  - id: 5
    category: "محدودیت"
    question: "اگر تنظیم پارامترها هنوز دستی است، مزیت BCOA چیست؟"
    answer: "این هنوز یک محدودیت است و آن را پنهان نمی‌کنم. مزیت فعلی BCOA در ساختار جستجو و شواهد تجربی آن است. مقاله برای پارامترهای اصلی تحلیل حساسیت و برای تنظیمات مهندسی روش تاگوچی را گزارش کرده، اما تنظیم پویای کاملاً خودکار هنوز جزو توسعه آینده است."
  - id: 6
    category: "روش"
    question: "BCOA پیوسته است یا گسسته؟"
    answer: "هسته BCOA برای فضای پیوسته طراحی شده است. در مسائل مختلط، نگاشت متغیرهای صحیح و دودویی و سپس ترمیم استفاده شده است. نسخه اختصاصی دودویی و گسسته یکی از مسیرهای توسعه آینده است."
  - id: 7
    category: "آماری"
    question: "چطور می‌دانید نتایج ناشی از شانس نیستند؟"
    answer: "سی اجرای مستقل، میانگین و انحراف معیار، آزمون ویلکاکسون، آزمون فریدمن، آزمون نموینی و همچنین قابلیت اطمینان بررسی شده‌اند. بنابراین نتیجه فقط بر اساس بهترین اجرای منفرد نیست."
  - id: 8
    category: "آماری"
    question: "چرا ویلکاکسون؟"
    answer: "چون یک آزمون ناپارامتری است و برای مقایسه نتایج تصادفی الگوریتم‌های فراابتکاری مناسب است و به فرض نرمال بودن متکی نیست."
  - id: 9
    category: "آماری"
    question: "چرا فریدمن؟"
    answer: "چون چند الگوریتم را روی چند تابع به‌صورت هم‌زمان مقایسه می‌کنیم و فریدمن برای رتبه‌بندی کلی در چنین ساختاری مناسب است و فرض نرمال بودن داده‌ها را تحمیل نمی‌کند."
  - id: 10
    category: "آماری"
    question: "میانگین رتبه ۱٫۰۹ دقیقاً یعنی چه؟"
    answer: "یعنی وقتی رتبه الگوریتم‌ها در هر یک از ۳۲ تابع محاسبه و سپس میانگین گرفته شد، BCOA بهترین میانگین رتبه را داشت. این عدد به معنی بهترین بودن در تک‌تک توابع نیست."
    tip: "تفسیر «۳۱ بار اول شدن» نادرست است؛ میانگین رتبه با برتری در تک‌تک توابع فرق دارد."
  - id: 11
    category: "آماری"
    question: "تحلیل حذف مؤلفه‌ها دقیقاً چه چیزی را ثابت می‌کند؟"
    answer: "اثبات نظری نیست؛ شواهد تجربی است. با حذف کنترل‌شده هر مؤلفه و ثابت نگه داشتن سایر شرایط می‌توان دید کدام سازوکار بیشترین اثر را روی عملکرد کلی دارد. در این‌جا حذف حرکت زاویه‌محور بیشترین افت را ایجاد کرده است."
  - id: 12
    category: "آماری"
    question: "چرا قابلیت اطمینان مهم است؟"
    answer: "چون الگوریتم تصادفی است. ممکن است یک بار جواب بسیار خوبی پیدا کند ولی در اجراهای دیگر نه. نرخ موفقیت نشان می‌دهد چه سهمی از اجراهای مستقل به ناحیه جواب موفق رسیده‌اند."
  - id: 13
    category: "پیچیدگی"
    question: "پیچیدگی زمانی BCOA چیست؟"
    answer: "برای هر تکرار از مرتبه N ضرب‌در مجموع بُعد و هزینه تابع هدف و برای کل تکرارها از مرتبه T ضرب‌در همان مقدار است؛ بنابراین تعداد تکرارها، اندازه جمعیت، بُعد مسئله و هزینه تابع هدف، عوامل اصلی هزینه‌اند."
    keySentence: "وابستگی به بُعد مسئله وجود دارد و حذف آن را ادعا نمی‌کنیم."
  - id: 14
    category: "محدودیت"
    question: "محدودیت اصلی پژوهش چیست؟"
    answer: "هسته روش برای فضای پیوسته طراحی شده، تنظیم پارامترها هنوز به‌طور کامل خودکار نشده و برای مسائل کاملاً دودویی یا چندهدفه به توسعه اختصاصی نیاز داریم."
  - id: 15
    category: "کاربردی"
    question: "کاربرد واقعی چیست؟"
    answer: "در کار حاضر هفت مسئله مهندسی و شبکه‌ای بررسی شده‌اند. در سطح بالقوه، چنین چارچوبی می‌تواند در طراحی مهندسی، تخصیص منابع، جایابی سرور و استقرار پهپاد کاربرد داشته باشد. برای سناریوهای صنعتی بزرگ، بهینه‌سازی بهتر می‌تواند اثر اقتصادی قابل‌توجهی داشته باشد، ولی در این پژوهش مقدار صرفه‌جویی دلاری مشخصی اندازه‌گیری نشده است."
  - id: 16
    category: "کاربردی"
    question: "چرا مسئله پهپاد را مهم می‌دانید؟"
    answer: "در مسئله مورد مطالعه، بین پوشش، انرژی و هم‌پوشانی مناطق نوعی تعارض وجود دارد و همین موضوع فضای جستجو را دشوار می‌کند. این مسئله برای نشان دادن رفتار الگوریتم در یک مسئله کاربردی شبکه‌ای مناسب است."
    tip: "اگر سناریوی زلزله مطرح شد بگو: «زلزله را به‌عنوان یک سناریوی کاربردی بالقوه مطرح می‌کنم، نه به‌عنوان سناریوی آزمایش‌شده پایان‌نامه.»"
  - id: 17
    category: "دام‌دار"
    question: "این الگوریتم چگونه با متغیرهای گسسته کنار می‌آید؟"
    answer: "جستجوی هسته در فضای پیوسته انجام می‌شود و برای تبدیل متغیرهای صحیح از گردکردن و برای متغیرهای دودویی از آستانه ۰٫۵ استفاده شده است؛ سپس در صورت نیاز ترمیم انجام می‌شود تا قیود رعایت شوند."
    keySentence: "هسته پیوسته است؛ نسخه کاملاً اختصاصی گسسته جزو کارهای آینده است."
