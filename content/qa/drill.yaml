items:
  - role: "داور یک"
    category: "آسان"
    q: "در یک جمله، نوآوری اصلی چیست؟"
    a: "مدل‌سازی صریح حرکت زاویه‌محور در فرایند جستجو و ترکیب آن با وراثت جهت، اصلاح تطبیقی زاویه و رقابت سرزمینی."
  - role: "داور یک"
    category: "متوسط"
    q: "چرا این جهت‌دهی را در PSO نمی‌بینیم؟"
    a: "PSO هم اطلاعات حرکتی دارد، اما ساختار BCOA مشخصاً بر زاویه مهاجرت متمرکز است و این زاویه بین نسل‌ها منتقل و در طول جستجو با بهترین فرد، همسایه موفق و اختلال تطبیقی اصلاح می‌شود. تفاوت در ساختار کامل دینامیک جستجوست."
  - role: "داور دو"
    category: "روش"
    q: "چه چیزی از والد به فرزند منتقل می‌شود؟"
    a: "اطلاعات اصلی که منتقل می‌شود زاویه مهاجرت یا حرکت زاویه‌محور است؛ این زاویه با وزن‌دهی بر اساس برازندگی والدین ترکیب و با یک اختلال کوچک متنوع می‌شود."
  - role: "داور دو"
    category: "آماری"
    q: "۱٫۰۹ یعنی در ۳۲ مسئله، ۳۱ بار اول شده‌اید؟"
    a: "نه؛ این تفسیر دقیق نیست. ۱٫۰۹ میانگین رتبه در ۳۲ تابع است. ممکن است در بعضی توابع رتبه دیگری داشته باشیم؛ مهم این است که میانگین کلی رتبه، بهترین بوده است."
  - role: "داور یک"
    category: "سخت"
    q: "چرا به نتیجه الگوریتمت اعتماد کنیم؟"
    a: "چون نتیجه فقط از یک معیار نیامده است. سی اجرای مستقل، میانگین و انحراف معیار، آزمون‌های آماری، قابلیت اطمینان و مطالعه حذف مؤلفه‌ها در کنار هم انجام شده‌اند."
  - role: "داور دو"
    category: "محدودیت"
    q: "ضعف اصلی BCOA چیست؟"
    a: "هسته روش پیوسته است و برای فضای کاملاً گسسته به توسعه اختصاصی نیاز دارد؛ ضمن اینکه تنظیم پارامترها هنوز کاملاً خودکار نشده است."
  - role: "داور دو"
    category: "پیچیدگی"
    q: "پس در ابعاد خیلی بالا هنوز وابستگی به بُعد دارید؛ مزیت محاسباتی کجاست؟"
    a: "بله، وابستگی به بُعد همچنان وجود دارد و ادعای حذف آن را نداریم. مزیت ادعاشده، کاهش بخشی از سربار محاسبات هندسی مرتبط با راهبردهای فاصله‌محور است؛ ضمن اینکه هزینه عملی هنوز به هزینه تابع هدف وابسته است."
  - role: "داور یک"
    category: "کاربردی"
    q: "در مسئله پهپاد دقیقاً چه چیزی بهینه شد؟"
    a: "در مسئله مورد مطالعه، جایابی پهپادها با توجه به پوشش، مصرف انرژی و اثر هم‌پوشانی مناطق پوشش دنبال شد. هدف این بود که به یک تعادل مناسب در تابع هزینه برسیم."
  - role: "داور دو"
    category: "دام‌دار"
    q: "پس الگوریتمت هم برای مسائل گسسته عالی است؟"
    a: "هسته الگوریتم پیوسته است. در مسائل مختلط، نگاشت متغیرهای صحیح و دودویی و ترمیم استفاده شده، اما نسخه کاملاً اختصاصی گسسته و دودویی را هنوز به‌عنوان کار آینده در نظر می‌گیریم."
