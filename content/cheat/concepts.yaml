concepts:
  - id: "pvalue"
    label: "p-value و معناداری آماری"
    heading: "عدد کوچک یعنی اختلاف تصادفی نیست"
    en: "p-value"
    tone: "ochre"
    body:
      - "p-value احتمال دیدن تفاوتی به این شدت (یا شدیدتر) است، اگر در واقع تفاوتی بین دو روش وجود نداشته باشد؛ هرچه کوچک‌تر باشد، شواهد علیه تصادفی بودن نتیجه قوی‌تر است."
      - "قاعده روز دفاع: اگر p-value کوچک‌تر از سطح معنی‌داری ۰٫۰۵ باشد، اختلاف از نظر آماری معنادار است."
      - "دو نمونه مقاله: p-value در برابر GA برابر 0.0004 و در برابر PSO برابر 0.0002 است؛ هر دو بسیار کوچک‌تر از ۰٫۰۵اند و نشان می‌دهند برتری BCOA روی همین جفت‌ها از نظر آماری معنادار است."
      - "نکته: p-value نه «احتمال درست بودن فرض صفر» است و نه اندازه بزرگی اثر را می‌گوید."
  - id: "stddev"
    label: "انحراف معیار"
    heading: "پراکندگی اجراها؛ نه فقط میانگین"
    en: "Standard deviation"
    tone: "pine"
    body:
      - "برای هر تابع یا مسئله، ۳۰ اجرای مستقل انجام شده است؛ میانگین، مرکز نتایج را نشان می‌دهد و انحراف معیار، پراکندگی اجراها را دور همان میانگین."
      - "انحراف معیار کوچک‌تر یعنی اجراها به هم نزدیک‌ترند؛ پس نتیجه پایدارتر و تکرارپذیرتر است. در جدول‌ها، کنار هر میانگین، انحراف معیار هم گزارش شده است."
      - "مقایسه انحراف معیار خام فقط بین روش‌ها روی یک مسئله معنا دارد؛ برای مقایسه کلی میان توابع با مقیاس‌های متفاوت به رتبه‌بندی فریدمن برمی‌گردیم."
  - id: "friedman"
    label: "آزمون رتبه‌بندی فریدمن و عدد ۱٫۰۹"
    heading: "چرا فریدمن، نه میانگین خام؟"
    en: "Friedman rank test"
    tone: "pine"
    body:
      - "توابع محک مقیاس‌های بسیار ناهمگونی دارند؛ جمع زدن مقادیر خام، نتیجه را به نفع توابع با مقیاس بزرگ منحرف می‌کند."
      - "فریدمن در هر تابع به روش‌ها رتبه می‌دهد (بهترین، رتبه یک) و سپس میانگین رتبه هر روش را در کل ۳۲ تابع حساب می‌کند."
      - "میانگین رتبه BCOA برابر ۱٫۰۹ یعنی به‌طور میانگین تقریباً همیشه رتبه نخست یا دوم را داشته و بهترین میانگین رتبه در میان هر ۱۰ روش است؛ نه اینکه در تک‌تک توابع اول شده باشد."
  - id: "wilcoxon"
    label: "آزمون ویلکاکسون"
    heading: "معناداری تفاوت در مقایسه‌های جفتی"
    en: "Wilcoxon signed-rank test"
    tone: "ochre"
    body:
      - "فریدمن رتبه‌بندی کلی می‌دهد اما نمی‌گوید برتری BCOA بر یک رقیب مشخص، تصادفی است یا معنادار؛ ویلکاکسون برای همین مقایسه جفتی به کار می‌رود."
      - "یک آزمون ناپارامتری زوجی است و به فرض نرمال بودن داده‌ها متکی نیست؛ این ویژگی برای نتایج تصادفی الگوریتم‌های فراابتکاری ضروری است."
      - "دو نمونه برجسته در مقاله: p-value برابر GA برابر 0.0004 و برابر PSO برابر 0.0002 که بسیار کوچک‌تر از سطح معنی‌داری ۰٫۰۵ هستند."
  - id: "discrete"
    label: "مسائل گسسته و دودویی"
    heading: "نگاشت متغیرها از فضای پیوسته"
    en: "Discrete and binary mapping"
    tone: "clay"
    body:
      - "هسته BCOA برای فضای پیوسته طراحی شده و در مسائل مختلط، جستجو همچنان پیوسته انجام می‌شود."
      - "متغیرهای صحیح با گردکردن و متغیرهای دودویی با آستانه ۰٫۵ (یک اگر بزرگ‌تر از ۰٫۵، در غیر این صورت صفر) ساخته می‌شوند."
      - "پس از نگاشت، در صورت نیاز عملگر ترمیم قیود اجرا می‌شود؛ نسخه اختصاصی تمام‌گسسته، جزو کارهای آینده است و نباید ادعای دیگری کرد."
