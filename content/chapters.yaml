intro:
  id: "start"
  num: "شروع"
  title: "شروع جلسه"
chapters:
  - id: "ch1"
    num: "۰۱"
    title: "مقدمه"
    summary: "ساختن زمینه مسئله و جایگاه پژوهش در یک جمله."
    goal: "زمینه‌سازی درباره اهمیت مسئله، بدون ورود به سخنرانی عمومی."
  - id: "ch2"
    num: "۰۲"
    title: "بیان مسئله و شکاف پژوهش"
    summary: "چالش تعادل جستجو و شکاف «حرکت زاویه‌محور به‌عنوان مؤلفه صریح»."
    goal: "رساندن داور به پرسش «آیا می‌شود حرکت زاویه‌محور را صریح مدل کرد؟»"
  - id: "ch3"
    num: "۰۳"
    title: "اهمیت و ضرورت پژوهش"
    summary: "چهار دلیل برای ارزش‌مندی ایده و گستره ارزیابی."
    goal: "جای‌دادن ایده در یک برنامه کامل ارزیابی."
  - id: "ch4"
    num: "۰۴"
    title: "روش پیشنهادی BCOA"
    summary: "چهار مؤلفه، معماری اجرا و سه رابطه اصلی ریاضی."
    goal: "تبدیل ایده به مدل ریاضی روشن و قابل دفاع."
  - id: "ch5"
    num: "۰۵"
    title: "طراحی آزمایش و یافته‌ها"
    summary: "۳۲ تابع محک، مسائل مهندسی و شبکه‌ای، قابلیت اطمینان."
    goal: "نشان دادن شواهد تجربی گسترده و دقیق."
  - id: "ch6"
    num: "۰۶"
    title: "بحث، تحلیل و اعتبارسنجی"
    summary: "آزمون‌های آماری، تحلیل حذف مؤلفه‌ها، پیچیدگی زمانی."
    goal: "بالا بردن سطح ادعا از گزارش عدد به استدلال علمی."
  - id: "ch7"
    num: "۰۷"
    title: "محدودیت‌ها و کارهای آتی"
    summary: "مرزهای اعتبار پژوهش و مسیرهای توسعه."
    goal: "نمایش بلوغ پژوهشی با مرزبندی صادقانه ادعاها."
  - id: "ch8"
    num: "۰۸"
    title: "جمع‌بندی"
    summary: "مسئله چه بود، چه کردیم و چه دیدیم."
    goal: "بستن روایت در چند جمله دقیق و آرام."
